JWT_KEY: c3RhcmdhemVyLXRlc3Qtb25seS1qd3Qtc2VjcmV0LWtleS0wMDAw

MET_NORWAY_USER_AGENT: stargazer-test
KAKAO_REST_API_KEY: test-kakao-rest-api-key

GOOGLE_CLIENT_ID: test-google-id
GOOGLE_CLIENT_SECRET: test-google-secret
KAKAO_CLIENT_ID: test-kakao-id
