# 테스트 프로필. application.yml이 환경변수로 받는 값을 같은 이름으로 채운다.
# 모두 가짜 값이다. MySQL과 Redis 접속 정보는 Testcontainers가 덮어쓰고,
# 외부 API는 ExternalApiStubs가 가로채므로 키가 실제로 쓰이지 않는다.

MYSQL_ENDPOINT: overridden-by-testcontainers
MYSQL_USERNAME: test
MYSQL_PASSWORD: test

