services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    logging: &rotate
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      # 1GB VM 에서 mysql·redis 와 같이 돌기 위한 힙 상한
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx320m -Xss512k -XX:MaxMetaspaceSize=160m"
      LOG_PATH: /app/logs
      RDS_ENDPOINT: mysql
      REDIS_ENDPOINT: redis
    volumes:
      - ./app-logs:/app/logs
    logging: *rotate
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: stargazer
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=128M
      --performance-schema=OFF
      --max-connections=30
    volumes:
      - ./mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging: *rotate

  redis:
    image: redis:alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    logging: *rotate

volumes:
  caddy_data:
